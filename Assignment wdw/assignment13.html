<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 13 - Rowspan and Colspan</title>
    <style>
        table {
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 6px 10px;
        }
    </style>
</head>
<body>

    <table>
        <caption><strong>Weekly Timetable</strong></caption>
        <tr>
            <th>Day</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
        </tr>
        <tr>
            <td>Mon</td>
            <td>Maths</td>
            <td>HTML</td>
            <td rowspan="2">Web Lab</td>
        </tr>
        <tr>
            <td>Tue</td>
            <td>DBMS</td>
            <td>OS</td>
        </tr>
        <tr>
            <td>Wed</td>
            <td colspan="3">Seminar</td>
        </tr>
    </table>

</body>
</html>
