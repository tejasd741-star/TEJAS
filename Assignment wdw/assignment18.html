<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 18 - Accessible Student Admission Page</title>
    <style>
        body {
            font-family: Georgia, serif;
            margin: 20px;
        }
        header, footer {
            background-color: #102070;
            color: white;
            text-align: center;
            padding: 15px;
        }
        footer {
            padding: 8px;
            font-size: 13px;
            margin-top: 20px;
        }
        main {
            max-width: 650px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        caption {
            font-weight: bold;
            margin-bottom: 5px;
        }
        th, td {
            border: 1px solid #888;
            padding: 6px 10px;
            text-align: left;
        }
        th {
            background-color: #e6e8f0;
            text-align: center;
        }
        fieldset {
            border: 1px solid #888;
            padding: 15px;
        }
        input[type="text"], input[type="email"] {
            width: 280px;
            padding: 4px;
        }
        textarea {
            width: 90%;
            height: 60px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <h2>Courses and Fees</h2>

        <table>
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
            </tbody>
        </table>

        <form action="#" method="post">
            <fieldset>
                <legend>Application Form</legend>

                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="course">Course:</label><br>
                    <select id="course" name="course">
                        <option value="btech" selected>B.Tech CSE</option>
                        <option value="bca">BCA</option>
                    </select>
                </p>

                <p>
                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" required></textarea>
                </p>

                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </main>

    <footer>
        &copy; 2026 ABC College
    </footer>

</body>
</html>
